name: Deploy Virtcruise to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static website
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare static site
        shell: bash
        run: |
          set -euo pipefail
          test ! -e _pages
          test -f index.html
          for directory in css js images fonts data packages account auth bookings dashboard financial \
            forgot-password notifications preferences profile quotes register reset-password signin \
            travellers trips verify-email; do
            test -d "$directory"
          done

          mkdir _pages
          cp index.html .nojekyll _pages/
          cp -R css js images fonts data packages account auth bookings dashboard financial \
            forgot-password notifications preferences profile quotes register reset-password signin \
            travellers trips verify-email _pages/
          find _pages -name .gitkeep -delete

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
